<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - FeedFusion</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FeedFusion</h1>
            <p>Créer un nouveau compte</p>
        </header>

        <main class="auth-container">
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required placeholder="Entrez votre nom d'utilisateur">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirmez votre mot de passe">
                </div>

                <button type="submit" class="btn btn-primary">S'inscrire</button>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </form>

            <div class="auth-links">
                <p>Déjà un compte ? <a href="/login">Se connecter</a></p>
            </div>
        </main>

        <footer>
            <p><a href="/">Retour à l'accueil</a></p>
        </footer>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Clear messages
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('successMessage').textContent = '';

            // Validate
            if (password !== confirmPassword) {
                document.getElementById('errorMessage').textContent = 'Les mots de passe ne correspondent pas';
                return;
            }

            if (password.length < 6) {
                document.getElementById('errorMessage').textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erreur lors de l\'inscription');
                }

                document.getElementById('successMessage').textContent = 'Inscription réussie ! Redirection...';

                // Store token and redirect
                if (data.token) {
                    document.cookie = `token=${data.token}; path=/; max-age=${24 * 60 * 60}`;
                }

                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
            }
        });
    </script>
</body>
</html>
