<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedFusion - Déconnecté</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>FeedFusion</h1>
            <p class="subtitle">Agrégateur RSS avec WebSub</p>
            
            <div class="logout-message">
                <i class="fas fa-check-circle" style="color: var(--success); font-size: 3rem; margin-bottom: 1rem;"></i>
                <h2>Vous êtes déconnecté</h2>
                <p>Votre session a été terminée avec succès.</p>
            </div>
            
            <a href="/login" class="btn btn-primary" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Se reconnecter
            </a>
        </div>
    </div>
</body>
</html>
