<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un flux - FeedFusion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS par fonctionnalité -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/admin.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-rss"></i> Mes Flux</h2>
            </div>
            <div class="sidebar-form">
                <div class="filter-options">
                    <a href="/" class="filter-option-link">
                        <i class="fas fa-arrow-left"></i> Retour aux articles
                    </a>
                    <a href="/feeds" class="filter-option-link">
                        <i class="fas fa-rss"></i> Gérer les flux
                    </a>
                    <a href="/categories" class="filter-option-link">
                        <i class="fas fa-tags"></i> Gérer les catégories
                    </a>
                    <a href="/settings" class="filter-option-link">
                        <i class="fas fa-cog"></i> Paramètres
                    </a>
                    <a href="/users" class="filter-option-link" id="usersLink" style="display: none;">
                        <i class="fas fa-users"></i> Gérer les utilisateurs
                    </a>
                </div>
            </div>
            <div class="sidebar-footer">
                <a href="/feeds" class="btn" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
                <a href="/login" class="btn btn-secondary logout-btn" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </a>
                <form id="logoutForm" action="/api/logout" method="POST" style="display: none;"></form>
            </div>
            <script>
                // Initialiser au chargement
                document.addEventListener('DOMContentLoaded', checkAdminStatus);
            </script>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1><a href="/"><img src="/static/images/logo.png" alt="FeedFusion" class="logo">FeedFusion</a></h1>
            </header>

            <div class="content-wrapper">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <h2><i class="fas fa-edit"></i> Modifier un flux</h2>
                    </div>
                    <div class="toolbar-right">
                        <button onclick="toggleTheme()" class="btn theme-toggle" title="Basculer le thème">
                            <i class="fas fa-moon" id="theme-toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <form action="/feed/{{.Feed.ID}}/edit" method="POST" class="form-group">
                    <div class="form-row" style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
                            <i class="fas fa-link"></i> URL du flux *
                        </label>
                        <input type="url" name="url" class="form-input" value="{{.Feed.URL}}"
                            placeholder="https://exemple.com/feed.xml" required>
                    </div>

                    <div class="form-row" style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
                            <i class="fas fa-rss"></i> Titre
                        </label>
                        <input type="text" name="title" class="form-input" value="{{.Feed.Title}}"
                            placeholder="Mon flux RSS">
                    </div>

                    <div class="form-row" style="margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="include" {{if .Feed.Include}}checked{{end}}>
                            <span><i class="fas fa-check"></i> Inclure dans la fusion</span>
                        </label>
                    </div>
                    
                    {{if .Categories}}
                    <div class="form-row" style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
                            <i class="fas fa-tags"></i> Catégorie
                        </label>
                        <select name="category_id" id="category_id" class="form-select">
                            <option value="">-- Aucune catégorie --</option>
                            {{range .Categories}}
                            <option value="{{.ID}}" {{if eq .ID $.CurrentCategoryID}}selected{{end}}>
                                {{.Name}}
                            </option>
                            {{end}}
                        </select>
                    </div>
                    {{end}}

                    <div class="form-row">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Sauvegarder
                        </button>
                        <a href="/feeds" class="btn" style="margin-left: 0.5rem;">
                            <i class="fas fa-times"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
