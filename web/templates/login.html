<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedFusion - Connexion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>FeedFusion</h1>
            <p class="subtitle">Agrégateur RSS avec WebSub</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required autofocus>
                </div>
                <div class="form-group password-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Afficher/Masquer le mot de passe">
                            <i class="fas fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = '';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    errorMessage.textContent = error || 'Identifiants invalides';
                    return;
                }
                
                const data = await response.json();
                // Stockage du token (le cookie est déjà défini par le serveur)
                // Redirection vers la page d'accueil
                window.location.href = '/';
            } catch (err) {
                errorMessage.textContent = 'Erreur de connexion au serveur';
                console.error('Login error:', err);
            }
        });
    </script>
</body>
</html>
