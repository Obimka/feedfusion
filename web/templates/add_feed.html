<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un flux - FeedFusion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS par fonctionnalité -->
    <script src="/static/js/theme.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-rss"></i> Mes Flux</h2>
            </div>
            <div class="sidebar-form">
                <div class="filter-options">
                    <a href="/" class="filter-option-link">
                        <i class="fas fa-arrow-left"></i> Retour
                    </a>
                </div>
            </div>
            <div class="sidebar-footer">
                <a href="/feeds" class="btn" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
                <a href="/settings" class="btn" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fas fa-cog"></i> Paramètres
                </a>
                <a href="/login" class="btn btn-secondary logout-btn" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </a>
                <form id="logoutForm" action="/api/logout" method="POST" style="display: none;"></form>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1><a href="/"><img src="/static/images/logo.png" alt="FeedFusion" class="logo">FeedFusion</a></h1>
            </header>

            <div class="content-wrapper">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <h2><i class="fas fa-plus-circle"></i> Ajouter un nouveau flux</h2>
                    </div>
                    <div class="toolbar-right">
                        <button onclick="toggleTheme()" class="btn theme-toggle" title="Basculer le thème">
                            <i class="fas fa-moon" id="theme-toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">
                    Entrez l'URL de votre flux RSS, Atom ou JSON Feed.
                </p>

                <form action="/add-feed" method="POST" class="form-group">
                    <div class="form-row">
                        <input type="url" name="url" class="form-input" placeholder="https://exemple.com/feed.xml"
                            required>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Ajouter
                        </button>
                    </div>
                </form>

                <div style="margin-top: 2rem;">
                    <h3><i class="fas fa-info-circle"></i> Exemples de flux :</h3>
                    <ul style="list-style: none; padding: 0;">
                        <li style="margin: 0.5rem 0;">
                            <code style="background: var(--bg); padding: 0.25rem 0.5rem; border-radius: 4px;">
                                https://www.lemonde.fr/rss/une.xml
                            </code>
                        </li>
                        <li style="margin: 0.5rem 0;">
                            <code style="background: var(--bg); padding: 0.25rem 0.5rem; border-radius: 4px;">
                                https://www.lefigaro.fr/rss/figaro_actualites.xml
                            </code>
                        </li>
                        <li style="margin: 0.5rem 0;">
                            <code style="background: var(--bg); padding: 0.25rem 0.5rem; border-radius: 4px;">
                                https://feeds.bbci.co.uk/news/rss.xml
                            </code>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
